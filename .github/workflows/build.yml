name: Build and release desktop binaries

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (leave blank for a test build)
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
          - runner: windows-11-arm
            target: windows-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: macos-amd64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux graphics headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libxcursor-dev libxfixes-dev
      - name: Test and build
        shell: bash
        run: |
          mkdir -p dist
          version=dev
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version="$RELEASE_TAG"
          fi
          flags="-s -w -X main.version=$version"
          case "${{ runner.os }}" in
            Windows)
              export CGO_ENABLED=0
              go test ./...
              go build -trimpath -ldflags="$flags -H=windowsgui" -o "dist/wireproxy-desktop-${{ matrix.target }}.exe" .
              ;;
            Linux)
              export CGO_ENABLED=1
              go test -tags novulkan ./...
              go build -tags novulkan -trimpath -ldflags="$flags" -o "dist/wireproxy-desktop-${{ matrix.target }}" .
              ;;
            macOS)
              export CGO_ENABLED=1
              export MACOSX_DEPLOYMENT_TARGET=15.0
              go test ./...
              output="dist/wireproxy-desktop-${{ matrix.target }}"
              go build -trimpath -ldflags="$flags" -o "$output" .
              codesign --force --sign - "$output"
              codesign --verify "$output"
              bundle="$RUNNER_TEMP/Wireproxy Desktop ${version}.app"
              sh scripts/build-macos-app.sh "$bundle" "$output" "$version"
              ditto -c -k --keepParent "$bundle" "$output.zip"
              rm -- "$output"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: wireproxy-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wireproxy-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish release and changelog
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == false ]]; then
            exit 0
          fi
          (
            cd dist
            sha256sum wireproxy-desktop-* > SHA256SUMS
          )
          awk -v tag="$RELEASE_TAG" '
            /^## / { if (found) exit; found = ($0 == "## " tag); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes --notes-file release-notes.md --title "$RELEASE_TAG"
